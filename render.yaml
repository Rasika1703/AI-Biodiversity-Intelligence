services:
  - type: web
    name: darukaa-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-5-20250929
      - key: USE_CHROMA
        value: "true"
      - key: CHROMA_DIR
        value: /var/data/chroma
      - key: DB_PATH
        value: /var/data/darukaa.db
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: darukaa-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: darukaa-web
    runtime: static
    rootDir: frontend
    plan: starter
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://darukaa-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
