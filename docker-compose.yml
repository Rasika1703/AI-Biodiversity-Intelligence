services:
  api:
    build: ./backend
    container_name: darukaa-api
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
    volumes:
      - darukaa-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build: ./frontend
    container_name: darukaa-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  darukaa-data:
